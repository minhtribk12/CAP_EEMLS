consumer_id: c2_safety
description: Safety.
prioritized_classes:
  - pedestrian
  - cyclist
  - motorcycle
request_rate_per_s: 20.0
objectives:
  accuracy_pedestrian:
    weight: 10.0
  accuracy_cyclist:
    weight: 10.0
  accuracy_motorcycle:
    weight: 10.0
  accuracy_car:
    weight: 3.0
  accuracy_truck:
    weight: 3.0
  accuracy_bus:
    weight: 3.0
  miss_rate_cyclist_as_motorcycle:
    weight: 50.0
    max_value: 0.2
    direction: minimize
cost_weight: 13.35
cost_range_max_per_1k: 30.0
requirements:

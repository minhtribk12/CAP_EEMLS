[project]
name = "eemls-consumer"
version = "1.0.0"
description = "Consumer and load tool: send queries to the control plane and read the results"
authors = [
    { name = "Minh-Tri Nguyen" },
    { name = "Hong-Linh Truong" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"

dependencies = [
    "eemls[database]==1.0.0",
    "pydantic (>=2.11.7,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
]

[project.scripts]
eemls-consumer = "eemls_consumer.main:main"
eemls-load = "eemls_consumer.load_test_command:main"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "eemls_consumer", from = "src" }]
include = [{ path = "src/eemls_consumer/py.typed", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
eemls = { path = "../..", develop = false, extras = ["database"] }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
ruff = "0.12.12"
mypy = "^1.14.0"
pytest-asyncio = "^1.3.0"
types-pyyaml = "^6.0.12"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
    "slow: takes more than a few seconds",
    "integration: needs a running dependency such as Postgres or the broker",
]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
mypy_path = "src:tests"
files = ["src", "tests"]
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["src/eemls_consumer"]
branch = true

[tool.coverage.report]
show_missing = true

[project]
name = "eemls-inference-service"
version = "1.0.0"
description = "Inference Service: serves one model and answers each request with its prediction"
authors = [
    { name = "Minh-Tri Nguyen" },
    { name = "Hong-Linh Truong" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"

dependencies = [
    "eemls==1.0.0",
    "pydantic (>=2.11.7,<3.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "httpx (>=0.28.1,<0.29.0)",
    # CPU runtime; GPU machines install onnxruntime-gpu instead.
    "onnxruntime (>=1.31.0,<2.0.0)",
    "pillow (>=11.0.0,<13.0.0)",
    "numpy (>=2.0.0,<3.0.0)",
]

[project.scripts]
eemls-inference-service = "eemls_inference_service.main:main"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "eemls_inference_service", from = "src" }]
include = [{ path = "src/eemls_inference_service/py.typed", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
eemls = { path = "../..", develop = false }

[tool.poetry.group.dev.dependencies]
onnx = "^1.23.0"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
ruff = "0.12.12"
mypy = "^1.14.0"
pytest-asyncio = "^1.3.0"
types-pyyaml = "^6.0.12"
pyyaml = ">=6.0.3,<7.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
    "slow: takes more than a few seconds",
    "integration: needs a running dependency such as Postgres or the broker",
    "requires_gpu: needs a CUDA or TensorRT device",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/eemls_inference_service"]
branch = true

[tool.coverage.report]
show_missing = true

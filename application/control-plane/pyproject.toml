[project]
name = "eemls-control-plane"
version = "1.0.0"
description = "Control plane: serve queries through the ensemble and adapt it with an approach"
authors = [
    { name = "Minh-Tri Nguyen" },
    { name = "Hong-Linh Truong" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"

dependencies = [
    "eemls[database,approaches]==1.0.0",
    "pydantic (>=2.11.7,<3.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
]

[project.scripts]
eemls-control-plane = "eemls_control_plane.main:main"
eemls-warm = "eemls_control_plane.warm_up:main"
eemls-collect = "eemls_control_plane.collect:main"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "eemls_control_plane", from = "src" }]
include = [{ path = "src/eemls_control_plane/py.typed", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
eemls = { path = "../..", develop = false, extras = ["database", "approaches"] }

[tool.poetry.group.dev.dependencies]
pyyaml = ">=6.0.3,<7.0.0"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
ruff = "0.12.12"
mypy = "^1.14.0"
types-pyyaml = "^6.0.12"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
    "slow: takes more than a few seconds",
    "integration: needs a running dependency such as Postgres or the broker",
]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
mypy_path = "src:tests"
files = ["src", "tests"]
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["src/eemls_control_plane"]
branch = true

[tool.coverage.report]
show_missing = true

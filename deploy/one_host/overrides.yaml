models/inference_services.yaml:
  autoscale:
    enabled: false
    max_replicas: 10
    cpu_percent: 70
    cooldown_s: 60
  services:
    infer-b1-pedestrian-bt3:
      model: b1_pedestrian
      device_type: beelink_bt3
      replicas: 1
    infer-b2-cyclist-bt3:
      model: b2_cyclist
      device_type: beelink_bt3
      replicas: 1
    infer-b3-motorcycle-pi4:
      model: b3_motorcycle
      device_type: raspberry_pi4
      replicas: 1
    infer-b1-general-pi4:
      model: b1_general
      device_type: raspberry_pi4
      replicas: 1
consumers/c1_navigation/initial_ensemble.yaml:
  members:
    - infer-b1-general-pi4
    - infer-b1-pedestrian-bt3
    - infer-b2-cyclist-bt3
consumers/c2_safety/initial_ensemble.yaml:
  members:
    - infer-b1-general-pi4
    - infer-b1-pedestrian-bt3
    - infer-b2-cyclist-bt3
consumers/c3_surveillance/initial_ensemble.yaml:
  members:
    - infer-b1-general-pi4
    - infer-b1-pedestrian-bt3
    - infer-b2-cyclist-bt3
services/deployment.yaml:
  image_tags:
    x86_cpu: cpu-amd64
    x86_gpu: cpu-amd64
    arm_cpu: cpu-amd64
    jetson: cpu-amd64
